spring:
  mongodb:
    host: localhost
    port: 27017
    database: ingestion_db


server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

# logging
logging:
  level:
    root: INFO
    com.example: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG

ingestion:
  max-batch-size: 500